<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Washing Machine</title>

  <meta
    name="description"
    content="Washing Machine — 500 Machines built on Robinhood Chain."
  >

  <meta
    name="theme-color"
    content="#09090b"
  >

  <style>

    /* =====================================================
       RESET
    ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;

      background: #09090b;

      color: #f5f5f5;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      line-height: 1.6;

      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      display: block;
      max-width: 100%;
    }


    /* =====================================================
       VARIABLES
    ===================================================== */

    :root {

      --black: #09090b;

      --black-2: #0d0d10;

      --black-3: #111114;

      --border: #25252c;

      --border-light: #34343d;

      --white: #f5f5f7;

      --gray: #92929c;

      --gray-dark: #62626c;

      --lavender: #cbbcff;

      --lavender-light: #e6e0ff;

      --mint: #b8f5dc;

      --pink: #ffb9dc;
    }


    /* =====================================================
       WATERMARK
    ===================================================== */

    .watermark {

      position: fixed;

      right: 18px;
      bottom: 14px;

      z-index: 9999;

      color:
        rgba(255,255,255,0.10);

      font-size: 9px;

      font-weight: 800;

      letter-spacing: 2px;

      pointer-events: none;

      user-select: none;

      white-space: nowrap;
    }


    /* =====================================================
       NAVBAR
    ===================================================== */

    .navbar {

      position: sticky;

      top: 0;

      z-index: 1000;

      width: 100%;

      background:
        rgba(9,9,11,0.94);

      border-bottom:
        1px solid
        rgba(255,255,255,0.07);

      backdrop-filter:
        blur(15px);
    }

    .nav-container {

      width: 100%;

      max-width: 1200px;

      min-height: 78px;

      margin: auto;

      padding:
        12px 24px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 30px;
    }


    /* LOGO */

    .nav-logo {

      display: flex;

      align-items: center;

      flex-shrink: 0;
    }

    .nav-logo img {

      width: 190px;

      height: auto;

      max-height: 58px;

      object-fit: contain;
    }


    /* NAV LINKS */

    .nav-links {

      display: flex;

      align-items: center;

      gap: 32px;
    }

    .nav-links a {

      color: #9999a3;

      font-size: 12px;

      font-weight: 800;

      letter-spacing: 1px;

      text-transform: uppercase;

      transition:
        color 0.2s ease;
    }

    .nav-links a:hover {

      color:
        #ffffff;
    }


    /* =====================================================
       HERO
    ===================================================== */

    .hero {

      width: 100%;

      padding:
        65px 24px 100px;
    }

    .hero-container {

      width: 100%;

      max-width: 1200px;

      margin: auto;
    }


    /* HERO BANNER */

    .hero-banner {

      width: 100%;

      margin-bottom: 70px;

      overflow: hidden;

      border:
        1px solid
        var(--border);

      border-radius: 18px;

      background:
        #cbbcff;
    }

    .hero-banner img {

      width: 100%;

      height: auto;

      display: block;
    }


    /* HERO CONTENT */

    .hero-content {

      max-width: 950px;

      margin: auto;

      text-align: center;
    }


    .eyebrow {

      display: inline-block;

      padding:
        8px 13px;

      margin-bottom: 24px;

      border:
        1px solid
        rgba(203,188,255,0.25);

      border-radius: 999px;

      background:
        rgba(203,188,255,0.05);

      color:
        var(--lavender);

      font-size: 10px;

      font-weight: 900;

      letter-spacing: 1.7px;

      text-transform: uppercase;
    }


    .hero-title {

      font-size:
        clamp(45px, 8vw, 88px);

      line-height:
        0.95;

      letter-spacing:
        -5px;

      text-transform:
        uppercase;

      margin-bottom:
        28px;
    }

    .hero-title span {

      color:
        var(--lavender);
    }


    .hero-description {

      max-width:
        730px;

      margin:
        auto;

      color:
        var(--gray);

      font-size:
        17px;

      line-height:
        1.8;
    }

    .hero-description strong {

      color:
        #ffffff;
    }


    /* =====================================================
       HERO STATS
    ===================================================== */

    .hero-stats {

      max-width:
        720px;

      margin:
        50px auto 0;

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      border-top:
        1px solid
        var(--border);

      border-bottom:
        1px solid
        var(--border);
    }

    .hero-stat {

      padding:
        22px 15px;

      border-right:
        1px solid
        var(--border);
    }

    .hero-stat:last-child {

      border-right:
        none;
    }

    .hero-stat-number {

      color:
        #ffffff;

      font-size:
        27px;

      font-weight:
        900;
    }

    .hero-stat-label {

      color:
        var(--gray-dark);

      font-size:
        9px;

      font-weight:
        900;

      letter-spacing:
        1.5px;

      text-transform:
        uppercase;
    }


    /* =====================================================
       GENERAL
    ===================================================== */

    .section {

      width: 100%;

      padding:
        110px 24px;
    }

    .section-dark {

      background:
        var(--black);
    }

    .section-soft {

      background:
        var(--black-2);

      border-top:
        1px solid
        var(--border);

      border-bottom:
        1px solid
        var(--border);
    }

    .container {

      width: 100%;

      max-width: 1200px;

      margin: auto;
    }


    .section-label {

      color:
        var(--lavender);

      font-size:
        10px;

      font-weight:
        900;

      letter-spacing:
        2px;

      text-transform:
        uppercase;

      margin-bottom:
        15px;
    }


    .section-title {

      max-width:
        850px;

      color:
        #ffffff;

      font-size:
        clamp(38px, 6vw, 65px);

      line-height:
        1;

      letter-spacing:
        -3px;

      text-transform:
        uppercase;

      margin-bottom:
        25px;
    }


    .section-description {

      max-width:
        730px;

      color:
        var(--gray);

      font-size:
        16px;

      line-height:
        1.8;
    }


    /* =====================================================
       ABOUT
    ===================================================== */

    .about-grid {

      margin-top:
        60px;

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap:
        18px;
    }


    .about-card {

      min-height:
        260px;

      padding:
        30px;

      background:
        var(--black-3);

      border:
        1px solid
        var(--border);

      border-radius:
        15px;

      transition:
        transform 0.2s ease,
        border-color 0.2s ease;
    }

    .about-card:hover {

      transform:
        translateY(-4px);

      border-color:
        var(--border-light);
    }


    .about-number {

      color:
        var(--lavender);

      font-size:
        11px;

      font-weight:
        900;

      letter-spacing:
        1px;

      margin-bottom:
        50px;
    }


    .about-card h3 {

      color:
        #ffffff;

      font-size:
        22px;

      text-transform:
        uppercase;

      margin-bottom:
        13px;
    }


    .about-card p {

      color:
        #85858e;

      font-size:
        14px;

      line-height:
        1.75;
    }


    /* =====================================================
       WALLET PROBLEM
    ===================================================== */

    .problem {

      display:
        grid;

      grid-template-columns:
        1fr 1fr;

      gap:
        70px;

      align-items:
        center;
    }


    .problem-box {

      padding:
        40px;

      background:
        var(--black-3);

      border:
        1px solid
        var(--border);

      border-radius:
        16px;
    }


    .problem-list {

      display:
        flex;

      flex-direction:
        column;

      gap:
        0;
    }


    .problem-item {

      padding:
        20px 0;

      border-bottom:
        1px solid
        var(--border);
    }

    .problem-item:last-child {

      border-bottom:
        none;
    }


    .problem-item strong {

      display:
        block;

      color:
        #ffffff;

      font-size:
        15px;

      margin-bottom:
        4px;
    }


    .problem-item span {

      color:
        #74747e;

      font-size:
        13px;
    }


    /* =====================================================
       UTILITY
    ===================================================== */

    .utility-header {

      display:
        flex;

      justify-content:
        space-between;

      align-items:
        flex-end;

      gap:
        40px;

      margin-bottom:
        60px;
    }


    .utility-header .section-description {

      max-width:
        470px;
    }


    /* FLOW */

    .flow {

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      border:
        1px solid
        var(--border);

      border-radius:
        16px;

      overflow:
        hidden;
    }


    .flow-card {

      min-height:
        310px;

      padding:
        35px;

      background:
        var(--black-3);

      border-right:
        1px solid
        var(--border);
    }


    .flow-card:last-child {

      border-right:
        none;
    }


    .flow-number {

      color:
        #5e5e68;

      font-size:
        11px;

      font-weight:
        900;
    }


    .flow-card h3 {

      margin-top:
        95px;

      margin-bottom:
        12px;

      font-size:
        37px;

      line-height:
        1;

      letter-spacing:
        -1px;
    }


    .flow-card p {

      max-width:
        300px;

      color:
        #85858e;

      font-size:
        14px;

      line-height:
        1.7;
    }


    .flow-card:nth-child(1) h3 {

      color:
        var(--lavender);
    }


    .flow-card:nth-child(2) h3 {

      color:
        var(--mint);
    }


    .flow-card:nth-child(3) h3 {

      color:
        var(--pink);
    }


    /* =====================================================
       TOKEN UTILITY
    ===================================================== */

    .token-grid {

      display:
        grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap:
        18px;

      margin-top:
        20px;
    }


    .token-card {

      padding:
        38px;

      background:
        var(--black-3);

      border:
        1px solid
        var(--border);

      border-radius:
        15px;
    }


    .token-symbol {

      display:
        inline-block;

      padding:
        8px 12px;

      margin-bottom:
        25px;

      background:
        #1b1b20;

      color:
        #ffffff;

      border-radius:
        7px;

      font-size:
        11px;

      font-weight:
        900;
    }


    .token-card h3 {

      color:
        #ffffff;

      font-size:
        27px;

      margin-bottom:
        12px;
    }


    .token-card p {

      color:
        #85858e;

      font-size:
        14px;

      line-height:
        1.8;
    }


    /* =====================================================
       SUPPLY
    ===================================================== */

    .supply {

      padding:
        120px 24px;

      background:
        var(--lavender);

      color:
        #0b0b0d;

      text-align:
        center;
    }


    .supply .section-label {

      color:
        #514967;
    }


    .supply-number {

      font-size:
        clamp(130px, 25vw, 290px);

      font-weight:
        900;

      line-height:
        0.8;

      letter-spacing:
        -15px;

      margin:
        45px 0;
    }


    .supply-title {

      font-size:
        clamp(32px, 5vw, 60px);

      line-height:
        1;

      letter-spacing:
        -3px;

      text-transform:
        uppercase;

      margin-bottom:
        25px;
    }


    .supply-text {

      max-width:
        620px;

      margin:
        auto;

      color:
        #454052;

      font-size:
        16px;

      line-height:
        1.8;
    }


    /* =====================================================
       CLOSING
    ===================================================== */

    .closing {

      padding:
        120px 24px;
    }


    .closing-inner {

      max-width:
        900px;

      margin:
        auto;

      text-align:
        center;
    }


    .closing-title {

      font-size:
        clamp(40px, 7vw, 75px);

      line-height:
        0.95;

      letter-spacing:
        -4px;

      text-transform:
        uppercase;

      margin:
        25px 0;
    }


    .closing-title span {

      color:
        var(--lavender);
    }


    .closing-description {

      max-width:
        680px;

      margin:
        auto;

      color:
        var(--gray);

      font-size:
        16px;

      line-height:
        1.8;
    }


    /* =====================================================
       X
    ===================================================== */

    .x-section {

      padding:
        55px 24px;

      border-top:
        1px solid
        var(--border);

      background:
        #070709;

      text-align:
        center;
    }


    .x-link {

      display:
        inline-block;

      color:
        var(--lavender);

      font-size:
        14px;

      font-weight:
        900;

      letter-spacing:
        2px;

      text-transform:
        uppercase;

      transition:
        color 0.2s ease;
    }


    .x-link:hover {

      color:
        #ffffff;
    }


    /* =====================================================
       DISCLAIMER
    ===================================================== */

    .disclaimer {

      max-width:
        850px;

      margin:
        50px auto 0;

      padding:
        20px;

      border:
        1px solid
        var(--border);

      border-radius:
        10px;

      background:
        var(--black-2);

      color:
        #62626c;

      font-size:
        11px;

      line-height:
        1.7;

      text-align:
        left;
    }


    /* =====================================================
       FOOTER
    ===================================================== */

    footer {

      padding:
        30px 24px 35px;

      background:
        #050507;

      border-top:
        1px solid
        var(--border);
    }


    .footer-container {

      width:
        100%;

      max-width:
        1200px;

      margin:
        auto;

      text-align:
        center;
    }


    .footer-logo {

      margin-bottom:
        15px;
    }


    .footer-logo img {

      width:
        145px;

      max-width:
        60%;

      height:
        auto;

      margin:
        auto;
    }


    .copyright {

      color:
        #565660;

      font-size:
        10px;

      font-weight:
        700;

      letter-spacing:
        1.5px;

      text-transform:
        uppercase;
    }


    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 850px) {

      .nav-container {

        min-height:
          68px;

        padding:
          10px 18px;
      }


      .nav-logo img {

        width:
          150px;
      }


      .nav-links {

        gap:
          16px;
      }


      .nav-links a {

        font-size:
          9px;

        letter-spacing:
          0.7px;
      }


      .hero {

        padding:
          35px 18px 75px;
      }


      .hero-banner {

        margin-bottom:
          50px;

        border-radius:
          12px;
      }


      .hero-title {

        letter-spacing:
          -3px;
      }


      .hero-description {

        font-size:
          15px;
      }


      .about-grid {

        grid-template-columns:
          1fr;
      }


      .problem {

        grid-template-columns:
          1fr;

        gap:
          35px;
      }


      .utility-header {

        display:
          block;
      }


      .utility-header .section-description {

        margin-top:
          20px;
      }


      .flow {

        grid-template-columns:
          1fr;
      }


      .flow-card {

        min-height:
          auto;

        border-right:
          none;

        border-bottom:
          1px solid
          var(--border);
      }


      .flow-card:last-child {

        border-bottom:
          none;
      }


      .flow-card h3 {

        margin-top:
          45px;
      }


      .token-grid {

        grid-template-columns:
          1fr;
      }


      .supply-number {

        letter-spacing:
          -8px;
      }


      .closing {

        padding:
          90px 18px;
      }


      .watermark {

        right:
          10px;

        bottom:
          9px;

        font-size:
          7px;
      }
    }


    /* =====================================================
       SMALL PHONE
    ===================================================== */

    @media (max-width: 500px) {

      .nav-container {

        flex-direction:
          column;

        justify-content:
          center;

        gap:
          5px;

        padding:
          10px 15px;
      }


      .nav-logo img {

        width:
          135px;
      }


      .nav-links {

        gap:
          20px;
      }


      .nav-links a {

        font-size:
          8px;
      }


      .hero {

        padding-top:
          25px;
      }


      .hero-title {

        font-size:
          52px;
      }


      .hero-stats {

        grid-template-columns:
          1fr;
      }


      .hero-stat {

        border-right:
          none;

        border-bottom:
          1px solid
          var(--border);
      }


      .hero-stat:last-child {

        border-bottom:
          none;
      }


      .section {

        padding:
          80px 18px;
      }


      .section-title {

        font-size:
          40px;

        letter-spacing:
          -2px;
      }


      .about-card {

        min-height:
          auto;

        padding:
          25px;
      }


      .about-number {

        margin-bottom:
          30px;
      }


      .problem-box {

        padding:
          25px;
      }


      .flow-card {

        padding:
          27px;
      }


      .token-card {

        padding:
          27px;
      }


      .supply {

        padding:
          90px 18px;
      }


      .supply-number {

        font-size:
          150px;
      }


      .supply-title {

        font-size:
          38px;
      }


      .closing-title {

        font-size:
          43px;
      }


      .disclaimer {

        margin-top:
          45px;

        padding:
          17px;
      }
    }

  </style>
</head>


<body>


  <!-- =====================================================
