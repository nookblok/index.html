<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Washing Machine</title>

  <meta
    name="description"
    content="Washing Machine — 500 Machines built on Robinhood Chain. HOLD. WASH. EARN."
  >

  <meta name="theme-color" content="#09090b">

  <style>

    /* =========================================
       RESET
    ========================================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #09090b;
      color: #f5f5f5;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      line-height: 1.6;

      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      max-width: 100%;
      display: block;
    }


    /* =========================================
       VARIABLES
    ========================================= */

    :root {
      --bg: #09090b;
      --bg-soft: #0d0d10;
      --card: #111114;

      --lavender: #cbbcff;
      --lavender-light: #e4ddff;

      --mint: #b8f5dc;
      --pink: #ffb9dc;

      --white: #ffffff;
      --muted: #96969f;

      --border: #24242a;
      --border-light: #303038;
    }


    /* =========================================
       WATERMARK
    ========================================= */

    .watermark {
      position: fixed;

      right: 18px;
      bottom: 16px;

      z-index: 999;

      color: rgba(255, 255, 255, 0.10);

      font-size: 9px;
      font-weight: 900;

      letter-spacing: 2px;

      text-transform: uppercase;

      pointer-events: none;
      user-select: none;
    }


    /* =========================================
       NAVBAR
    ========================================= */

    .navbar {
      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      z-index: 1000;

      background:
        rgba(9, 9, 11, 0.86);

      backdrop-filter: blur(16px);

      border-bottom:
        1px solid rgba(255,255,255,0.06);
    }

    .nav-inner {
      width: 100%;
      max-width: 1180px;

      height: 72px;

      margin: auto;

      padding:
        0 24px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 17px;

      font-weight: 900;

      letter-spacing: 1.5px;

      text-transform: uppercase;
    }

    .logo span {
      color: var(--lavender);
    }

    .nav-links {
      display: flex;
      align-items: center;

      gap: 30px;

      font-size: 12px;

      font-weight: 800;

      letter-spacing: 1px;

      text-transform: uppercase;
    }

    .nav-links a {
      color: #96969f;

      transition:
        color 0.2s ease;
    }

    .nav-links a:hover {
      color: #ffffff;
    }


    /* =========================================
       HERO
    ========================================= */

    .hero {
      min-height: 100vh;

      padding:
        130px 24px 80px;

      display: flex;
      align-items: center;
    }

    .hero-container {
      width: 100%;
      max-width: 1180px;

      margin: auto;
    }

    .hero-grid {
      display: grid;

      grid-template-columns:
        1.05fr
        0.95fr;

      gap: 70px;

      align-items: center;
    }


    /* HERO TEXT */

    .eyebrow {
      display: inline-flex;

      align-items: center;

      gap: 8px;

      padding:
        8px 13px;

      margin-bottom: 24px;

      border:
        1px solid
        rgba(203,188,255,0.25);

      border-radius: 999px;

      background:
        rgba(203,188,255,0.05);

      color: var(--lavender);

      font-size: 10px;

      font-weight: 900;

      letter-spacing: 1.5px;

      text-transform: uppercase;
    }

    .dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background:
        var(--mint);
    }

    .hero h1 {
      font-size:
        clamp(54px, 8vw, 92px);

      line-height:
        0.9;

      letter-spacing:
        -5px;

      text-transform:
        uppercase;

      margin-bottom:
        28px;
    }

    .hero h1 span {
      color:
        var(--lavender);
    }

    .hero-description {
      max-width:
        610px;

      color:
        var(--muted);

      font-size:
        17px;

      line-height:
        1.8;

      margin-bottom:
        32px;
    }

    .hero-description strong {
      color:
        var(--white);
    }


    /* =========================================
       HERO BUTTONS
    ========================================= */

    .hero-buttons {
      display:
        flex;

      gap:
        12px;

      flex-wrap:
        wrap;
    }

    .button {
      min-height:
        48px;

      padding:
        0 22px;

      display:
        inline-flex;

      align-items:
        center;

      justify-content:
        center;

      border-radius:
        9px;

      font-size:
        12px;

      font-weight:
        900;

      letter-spacing:
        0.8px;

      text-transform:
        uppercase;

      transition:
        all 0.2s ease;
    }

    .button-primary {
      background:
        var(--lavender);

      color:
        #0b0b0d;
    }

    .button-primary:hover {
      background:
        var(--lavender-light);

      transform:
        translateY(-2px);
    }

    .button-secondary {
      background:
        #111114;

      border:
        1px solid
        #33333a;

      color:
        #ffffff;
    }

    .button-secondary:hover {
      border-color:
        #666672;

      transform:
        translateY(-2px);
    }


    /* =========================================
       HERO IMAGE
    ========================================= */

    .hero-art {
      position:
        relative;
    }

    .hero-art-frame {
      padding:
        10px;

      border:
        1px solid
        #29292f;

      border-radius:
        18px;

      background:
        #101013;

      box-shadow:
        0 30px 80px
        rgba(0,0,0,0.45);
    }

    .hero-art img {
      width:
        100%;

      border-radius:
        10px;

      background:
        var(--lavender);
    }


    /* =========================================
       STATS
    ========================================= */

    .stats {
      max-width:
        700px;

      margin-top:
        48px;

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      border-top:
        1px solid
        var(--border);

      border-bottom:
        1px solid
        var(--border);
    }

    .stat {
      padding:
        20px 15px;

      border-right:
        1px solid
        var(--border);
    }

    .stat:last-child {
      border-right:
        none;
    }

    .stat-number {
      font-size:
        24px;

      font-weight:
        900;
    }

    .stat-label {
      color:
        #707078;

      font-size:
        9px;

      font-weight:
        900;

      letter-spacing:
        1px;

      text-transform:
        uppercase;
    }


    /* =========================================
       GENERAL SECTIONS
    ========================================= */

    section {
      padding:
        110px 24px;
    }

    .container {
      width:
        100%;

      max-width:
        1180px;

      margin:
        auto;
    }

    .section-label {
      color:
        var(--lavender);

      font-size:
        10px;

      font-weight:
        900;

      letter-spacing:
        2px;

      text-transform:
        uppercase;

      margin-bottom:
        16px;
    }

    .section-title {
      max-width:
        800px;

      font-size:
        clamp(38px, 6vw, 64px);

      line-height:
        1;

      letter-spacing:
        -3px;

      text-transform:
        uppercase;

      margin-bottom:
        22px;
    }

    .section-text {
      max-width:
        720px;

      color:
        var(--muted);

      font-size:
        16px;

      line-height:
        1.8;
    }


    /* =========================================
       ABOUT
    ========================================= */

    .about {
      background:
        var(--bg-soft);

      border-top:
        1px solid
        var(--border);

      border-bottom:
        1px solid
        var(--border);
    }

    .about-grid {
      margin-top:
        58px;

      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap:
        18px;
    }

    .card {
      padding:
        30px;

      background:
        var(--card);

      border:
        1px solid
        var(--border);

      border-radius:
        14px;

      transition:
        all 0.25s ease;
    }

    .card:hover {
      transform:
        translateY(-4px);

      border-color:
        var(--border-light);
    }

    .card-number {
      color:
        var(--lavender);

      font-size:
        11px;

      font-weight:
        900;

      margin-bottom:
        35px;
    }

    .card h3 {
      font-size:
        21px;

      text-transform:
        uppercase;

      margin-bottom:
        12px;
    }

    .card p {
      color:
        #85858e;

      font-size:
        14px;

      line-height:
        1.75;
    }


    /* =========================================
       UTILITY
    ========================================= */

    .utility {
      background:
        var(--bg);
    }

    .utility-head {
      display:
        flex;

      justify-content:
        space-between;

      align-items:
        flex-end;

      gap:
        30px;

      margin-bottom:
        58px;
    }

    .utility-head .section-text {
      max-width:
        470px;
    }

    .flow {
      display:
        grid;

      grid-template-columns:
        repeat(3, 1fr);

      border:
        1px solid
        var(--border);

      border-radius:
        16px;

      overflow:
        hidden;
    }

    .flow-step {
      min-height:
        280px;

      padding:
        35px;

      background:
        #101013;

      border-right:
        1px solid
        var(--border);
    }

    .flow-step:last-child {
      border-right:
        none;
    }

    .flow-number {
      color:
        #62626c;

      font-size:
        11px;

      font-weight:
        900;
    }

    .flow-step h3 {
      margin-top:
        80px;

      margin-bottom:
        12px;

      font-size:
        35px;

      letter-spacing:
        -1px;
    }

    .flow-step p {
      max-width:
        280px;

      color:
        #85858e;

      font-size:
        14px;
    }

    .flow-step:nth-child(1) h3 {
      color:
        var(--lavender);
    }

    .flow-step:nth-child(2) h3 {
      color:
        var(--mint);
    }

    .flow-step:nth-child(3) h3 {
      color:
        var(--pink);
    }


    /* =========================================
       TOKEN CARDS
    ========================================= */

    .tokens {
      margin-top:
        20px;

      display:
        grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap:
        18px;
    }

    .token {
      padding:
        35px;

      background:
        #0f0f12;

      border:
        1px solid
        var(--border);

      border-radius:
        14px;
    }

    .token-symbol {
      display:
        inline-block;

      padding:
        8px 12px;

      margin-bottom:
        26px;

      background:
        #1a1a1f;

      border-radius:
        7px;

      font-size:
        11px;

      font-weight:
        900;
    }

    .token h3 {
      font-size:
        27px;

      margin-bottom:
        10px;
    }

    .token p {
      color:
        #85858e;

      font-size:
        14px;

      line-height:
        1.8;
    }


    /* =========================================
       SUPPLY
    ========================================= */

    .scarcity {
      background:
        var(--lavender);

      color:
        #0b0b0d;

      text-align:
        center;
    }

    .scarcity .section-label {
      color:
        #504768;
    }

    .scarcity-number {
      font-size:
        clamp(130px, 25vw, 280px);

      line-height:
        0.8;

      font-weight:
        900;

      letter-spacing:
        -15px;

      margin:
        45px 0;
    }

    .scarcity-title {
      font-size:
        clamp(30px, 5vw, 55px);

      line-height:
        1;

      letter-spacing:
        -2px;

      text-transform:
        uppercase;

      margin-bottom:
        20px;
    }

    .scarcity-text {
      max-width:
        600px;

      margin:
        auto;

      color:
        #40394e;

      font-size:
        16px;

      line-height:
        1.7;
    }


    /* =========================================
       PHILOSOPHY
    ========================================= */

    .philosophy {
      text-align:
        center;
    }

    .philosophy-inner {
      max-width:
        900px;

      margin:
        auto;
    }

    .quote {
      margin:
        35px 0;

      font-size:
        clamp(38px, 6vw, 70px);

      line-height:
        1;

      letter-spacing:
        -3px;

      font-weight:
        900;

      text-transform:
        uppercase;
    }

    .quote span {
      color:
        var(--lavender);
    }


    /* =========================================
       DISCLAIMER
    ========================================= */

    .disclaimer {
      max-width:
        800px;

      margin:
        70px auto 0;

      padding:
        20px;

      background:
        #0d0d10;

      border:
        1px solid
        var(--border);

      border-radius:
        10px;

      color:
        #666670;

      font-size:
        11px;

      line-height:
        1.7;

      text-align:
        left;
    }


    /* =========================================
       MINT SECTION
    ========================================= */

    .mint-section {
      padding-top:
        40px;

      padding-bottom:
        100px;
    }

    .mint-box {
      padding:
        55px 30px;

      background:
        #101013;

      border:
        1px solid
        var(--border);

      border-radius:
        16px;

      text-align:
        center;
    }

    .mint-box .section-title {
      margin-left:
        auto;

      margin-right:
        auto;
    }

    .mint-box .section-text {
      margin-left:
        auto;

      margin-right:
        auto;
    }


    /* =========================================
       FOOTER
    ========================================= */

    footer {
      padding:
        50px 24px 35px;

      background:
        #070709;

      border-top:
        1px solid
        var(--border);
    }

    .footer-inner {
      max-width:
        1180px;

      margin:
        auto;
    }

    .footer-top {
      display:
        flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap:
        30px;
    }

    .footer-logo {
      font-size:
        16px;

      font-weight:
        900;

      letter-spacing:
        1px;

      text-transform:
        uppercase;
    }

    .footer-logo span {
      color:
        var(--lavender);
    }


    /* X SENDIRI DI BAWAH */

    .footer-social {
      margin-top:
        30px;

      padding-top:
        25px;

      border-top:
        1px solid
        var(--border);

      text-align:
        center;
    }

    .footer-social a {
      display:
        inline-block;

      color:
        var(--lavender);

      font-size:
        13px;

      font-weight:
        900;

      letter-spacing:
        1.5px;

      text-transform:
        uppercase;

      transition:
        color 0.2s ease;
    }

    .footer-social a:hover {
      color:
        #ffffff;
    }


    /* COPYRIGHT */

    .footer-copyright {
      margin-top:
        18px;

      text-align:
        center;

      color:
        #55555e;

      font-size:
        10px;

      font-weight:
        700;

      letter-spacing:
        1.5px;

      text-transform:
        uppercase;
    }


    /* =========================================
       MOBILE
    ========================================= */

    @media (max-width: 850px) {

      .nav-inner {
        height:
          65px;
      }

      .nav-links {
        gap:
          18px;
      }

      .hero {
        padding-top:
          105px;
      }

      .hero-grid {
        grid-template-columns:
          1fr;

        gap:
          50px;
      }

      .hero-art {
        order:
          -1;
      }

      .hero h1 {
        letter-spacing:
          -3px;
      }

      .hero-description {
        font-size:
          16px;
      }

      .stats {
        margin-top:
          40px;
      }

      .about-grid {
        grid-template-columns:
          1fr;
      }

      .utility-head {
        display:
          block;
      }

      .utility-head .section-text {
        margin-top:
          20px;
      }

      .flow {
        grid-template-columns:
          1fr;
      }

      .flow-step {
        min-height:
          auto;

        border-right:
          none;

        border-bottom:
          1px solid
          var(--border);
      }

      .flow-step:last-child {
        border-bottom:
          none;
      }

      .flow-step h3 {
        margin-top:
          45px;
      }

      .tokens {
        grid-template-columns:
          1fr;
      }

      .footer-top {
        flex-direction:
          column;

        align-items:
          flex-start;
      }
    }


    /* =========================================
       SMALL PHONES
    ========================================= */

    @media (max-width: 500px) {

      section {
        padding:
          80px 18px;
      }

      .hero {
        padding-left:
          18px;

        padding-right:
          18px;
      }

      .nav-inner {
        padding:
          0 18px;
      }

      .logo {
        font-size:
          14px;
      }

      .nav-links a {
        font-size:
          10px;
      }

      .hero h1 {
        font-size:
          53px;
      }

      .hero-buttons {
        flex-direction:
          column;
      }

      .button {
        width:
          100%;
      }

      .stats {
        grid-template-columns:
          1fr;
      }

      .stat {
        border-right:
          none;

        border-bottom:
          1px solid
          var(--border);
      }

      .stat:last-child {
        border-bottom:
          none;
      }

      .section-title {
        font-size:
          41px;

        letter-spacing:
          -2px;
      }

      .card,
      .token,
      .flow-step {
        padding:
          25px;
      }

      .scarcity-number {
        font-size:
          150px;

        letter-spacing:
          -8px;
      }

      .quote {
        font-size:
          42px;
      }

      .watermark {
        right:
          10px;

        bottom:
          10px;

        font-size:
          7px;
      }
    }

  </style>
</head>


<body>


  <!-- ========================================
       WATERMARK
  ========================================= -->

  <div class="watermark">
    2026 © WASHING MACHINE
  </div>


  <!-- ========================================
       NAVBAR
  ========================================= -->

  <nav class="navbar">

    <div class="nav-inner">

      <a href="#" class="logo">
        Washing<span>Machine</span>
      </a>

      <div class="nav-links">

        <a href="#about">
          About
        </a>

        <a href="#utility">
          Utility
        </a>

        <a href="#supply">
          Supply
        </a>

      </div>

    </div>

  </nav>


  <!-- ========================================
       MAIN
  ========================================= -->

  <main>


    <!-- ======================================
         HERO
    ======================================= -->

    <section class="hero">

      <div clas
